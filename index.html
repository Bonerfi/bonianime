<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videó Lejátszó (YouTube)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .player-container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* Aránytartó doboz a YouTube iframe-hez (16:9) */
        .video-responsive {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 arány */
            height: 0;
            overflow: hidden;
            background: #000;
        }

        .video-responsive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .controls {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        h2 {
            margin: 0;
            font-size: 1.2rem;
            text-align: center;
        }

        .btn {
            background-color: #007aff; /* iPhone kék */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            max-width: 200px;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="player-container">
    <div class="video-responsive">
        <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <div class="controls">
        <h2 id="videoTitle">Videó betöltése...</h2>
        <button class="btn" id="nextBtn">Következő rész ➔</button>
    </div>
</div>

<script>
    // 1. IDE MÁSOLD BE A YOUTUBE VIDEÓID ID-JÁT ÉS CÍMEIT!
    const playlist = [
        { id: "dQw4w9WgXcQ", title: "1. Rész: Bevezetés" },
        { id: "kJQP7kiw5Fk", title: "2. Rész: A folytatás" },
        { id: "9bZkp7q19f0", title: "3. Rész: Befejezés" }
    ];

    let currentVideoIndex = 0;

    const ytPlayer = document.getElementById('ytPlayer');
    const videoTitle = document.getElementById('videoTitle');
    const nextBtn = document.getElementById('nextBtn');

    // YouTube videó betöltése funkció
    function loadYouTubeVideo(index) {
        if (index < playlist.length) {
            currentVideoIndex = index;
            
            // playsinline=1 beállítás biztosítja, hogy iPhone-on ne ugorjon teljes képernyőre a videó kérés nélkül
            ytPlayer.src = `https://www.youtube.com/embed/${playlist[index].id}?playsinline=1&enablejsapi=1`;
            videoTitle.textContent = playlist[index].title;
        } else {
            videoTitle.textContent = "Vége a lejátszási listának!";
        }
    }

    // Következő rész gomb működése
    nextBtn.addEventListener('click', () => {
        let nextIndex = currentVideoIndex + 1;
        if (nextIndex < playlist.length) {
            loadYouTubeVideo(nextIndex);
        } else {
            // Ha a végére ért, kezdi előlről az első videóval
            loadYouTubeVideo(0);
        }
    });

    // Első videó betöltése az oldal megnyitásakor
    loadYouTubeVideo(0);
</script>

</body>
</html>
