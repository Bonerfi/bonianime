<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videó Lejátszó</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .player-container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            display: block;
            background: #000;
        }

        .controls {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        h2 {
            margin: 0;
            font-size: 1.2rem;
            text-align: center;
        }

        .btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            max-width: 200px;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="player-container">
    <video id="videoPlayer" controls playsinline autoplay muted>
        <source id="videoSource" src="" type="video/mp4">
        A böngésződ nem támogatja a videólejátszást.
    </video>

    <div class="controls">
        <h2 id="videoTitle">Videó betöltése...</h2>
        <button class="btn" id="nextBtn">Következő rész ➔</button>
    </div>
</div>

<script>
    // 1. IDE MÁSOLD BE A DROPBOX VAGY GOOGLE DRIVE DIREKT LINKEKET!
    const playlist = [
        { src: "https://www.dropbox.com/scl/fi/zwp68e5aidj4czwprwv9m/Naruto-Kun.Hu-Attack-on-Titan-S1-01-1080p.mp4?rlkey=dlwj12dmh92bkx0qdwm00zboc&st=11r8rlrd&raw=1", title: "1. Rész: Bevezetés" }
    ];

    let currentVideoIndex = 0;

    const videoPlayer = document.getElementById('videoPlayer');
    const videoSource = document.getElementById('videoSource');
    const videoTitle = document.getElementById('videoTitle');
    const nextBtn = document.getElementById('nextBtn');

    function loadVideo(index) {
        if (index < playlist.length) {
            currentVideoIndex = index;
            videoSource.src = playlist[index].src;
            videoTitle.textContent = playlist[index].title;
            videoPlayer.load();
            
            videoPlayer.play().catch(error => {
                console.log("Lejátszás elindításához koppints a képernyőre.");
            });
        } else {
            videoTitle.textContent = "Vége a lejátszási listának!";
            videoPlayer.pause();
        }
    }

    nextBtn.addEventListener('click', () => {
        let nextIndex = currentVideoIndex + 1;
        if (nextIndex < playlist.length) {
            loadVideo(nextIndex);
        } else {
            loadVideo(0); // Újrakezdés
        }
    });

    videoPlayer.addEventListener('ended', () => {
        let nextIndex = currentVideoIndex + 1;
        if (nextIndex < playlist.length) {
            loadVideo(nextIndex);
        }
    });

    loadVideo(0);
</script>

</body>
</html>
